<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Guest link maker</title>
<style>body{font:17px/1.5 -apple-system,Helvetica,Arial,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;color:#2a1a1e}textarea,input{width:100%;font:inherit;padding:10px;border:1px solid #c9b79a;border-radius:8px;margin:6px 0 14px}button{font:inherit;padding:9px 16px;border:0;border-radius:999px;background:#5a1f2b;color:#fff;cursor:pointer}.r{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eadfce;padding:10px 0;flex-wrap:wrap}.r b{min-width:140px}.r code{flex:1;min-width:200px;word-break:break-all;font-size:13px;color:#6b5a5c}small{color:#8a7270}</style></head>
<body>
<h1>Guest link maker</h1>
<p><small>Private tool. Do not upload this file with your public site, or delete it after use.</small></p>
<label>Your live website address</label>
<input id="base" placeholder="https://your-site.netlify.app/">
<label>One guest per line: Name, seats</label>
<textarea id="names" rows="8" placeholder="Anita Roy, 2&#10;Rahul Sen, 1"></textarea>
<button id="go">Make links</button>
<div id="out"></div>
<script>
document.getElementById('go').onclick=function(){
  var base=document.getElementById('base').value.trim()||location.origin+location.pathname.replace(/links\.html$/,'');
  if(!/\/$/.test(base)&&!/\.html$/.test(base))base+='/';
  var out=document.getElementById('out');out.textContent='';
  document.getElementById('names').value.split('\n').forEach(function(l){
    var p=l.split(','),n=(p[0]||'').trim();if(!n)return;
    var s=Math.min(6,Math.max(1,parseInt(p[1],10)||1)),u=base+'?guest='+encodeURIComponent(n)+'&seats='+s;
    var r=document.createElement('div');r.className='r';
    var b=document.createElement('b');b.textContent=n;
    var c=document.createElement('code');c.textContent=u;
    var cb=document.createElement('button');cb.textContent='Copy';cb.onclick=function(){navigator.clipboard.writeText(u);cb.textContent='Copied'};
    var w=document.createElement('a');w.href='https://wa.me/?text='+encodeURIComponent('You are warmly invited: '+u);w.target='_blank';w.rel='noopener';w.textContent='WhatsApp';
    r.append(b,c,cb,w);out.appendChild(r);
  });
};
</script>
</body></html>
